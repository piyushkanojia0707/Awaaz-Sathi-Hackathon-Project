<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Screen AI</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0f0f13;
        color: #e8e8f0;
        width: 520px;
        min-height: 540px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }

      header .dot {
        width: 10px; height: 10px;
        border-radius: 50%;
        background: #444;
        flex-shrink: 0;
        transition: background 0.3s;
      }
      header .dot.live { background: #e53935; animation: pulse 1.4s infinite; }
      header .dot.thinking { background: #ffa000; animation: pulse 0.7s infinite; }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50%       { opacity: 0.3; }
      }

      header h2 { font-size: 15px; font-weight: 600; flex: 1; }
      header #statusBadge {
        font-size: 11px; color: #888;
        background: #1e1e28; padding: 3px 8px;
        border-radius: 20px;
      }

      /* Preview canvas */
      #previewWrap {
        position: relative;
        background: #1a1a24;
        border-radius: 10px;
        overflow: hidden;
        border: 1px solid #2a2a38;
        min-height: 160px;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #preview {
        width: 100%;
        display: none;
        border-radius: 9px;
      }

      #previewPlaceholder {
        color: #444; font-size: 13px; padding: 32px;
        text-align: center; line-height: 1.6;
      }

      #snapshotOverlay {
        position: absolute; inset: 0;
        background: rgba(255,255,255,0.08);
        opacity: 0; pointer-events: none;
        transition: opacity 0.15s;
      }
      #snapshotOverlay.flash { opacity: 1; }

      /* API key row */
      #apiRow {
        display: flex; gap: 8px; align-items: center;
      }

      #apiRow input {
        flex: 1;
        background: #1e1e28;
        border: 1px solid #2a2a38;
        border-radius: 8px;
        color: #e8e8f0;
        font-size: 12px;
        padding: 7px 10px;
        outline: none;
      }
      #apiRow input:focus { border-color: #5c6bc0; }

      #saveKeyBtn {
        background: #3949ab;
        border: none; border-radius: 8px;
        color: white; font-size: 12px;
        padding: 7px 12px; cursor: pointer;
        white-space: nowrap;
      }
      #saveKeyBtn:hover { background: #5c6bc0; }

      /* Control buttons */
      .btn-row { display: flex; gap: 8px; }

      button.ctrl {
        flex: 1;
        padding: 10px;
        border-radius: 8px;
        border: none;
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition: background 0.2s, opacity 0.2s;
      }
      button.ctrl:disabled { opacity: 0.4; cursor: default; }
      button.ctrl.primary { background: #3949ab; color: white; }
      button.ctrl.primary:hover:not(:disabled) { background: #5c6bc0; }
      button.ctrl.danger  { background: #c62828; color: white; }
      button.ctrl.danger:hover:not(:disabled) { background: #e53935; }
      button.ctrl.snap    { background: #1b5e20; color: white; }
      button.ctrl.snap:hover:not(:disabled) { background: #2e7d32; }

      /* Chat area */
      #chat {
        flex: 1;
        background: #1a1a24;
        border: 1px solid #2a2a38;
        border-radius: 10px;
        overflow-y: auto;
        padding: 10px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        min-height: 120px;
        max-height: 220px;
      }

      .msg {
        padding: 8px 12px;
        border-radius: 8px;
        font-size: 13px;
        line-height: 1.5;
        max-width: 90%;
        word-break: break-word;
      }
      .msg.user { background: #283593; align-self: flex-end; }
      .msg.ai   { background: #1e2a1e; border: 1px solid #2e3f2e; align-self: flex-start; }
      .msg.sys  { color: #666; font-size: 11px; align-self: center; }

      /* Input row */
      #inputRow {
        display: flex; gap: 8px;
      }

      #userInput {
        flex: 1;
        background: #1e1e28;
        border: 1px solid #2a2a38;
        border-radius: 8px;
        color: #e8e8f0;
        font-size: 13px;
        padding: 9px 12px;
        outline: none;
        resize: none;
      }
      #userInput:focus { border-color: #5c6bc0; }
      #userInput::placeholder { color: #444; }

      #sendBtn {
        background: #3949ab;
        border: none; border-radius: 8px;
        color: white; font-size: 20px;
        width: 42px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.2s;
      }
      #sendBtn:hover:not(:disabled) { background: #5c6bc0; }
      #sendBtn:disabled { opacity: 0.4; cursor: default; }

      #micBtn {
        background: #1e2a1e;
        border: 1px solid #2e3f2e;
        border-radius: 8px;
        color: #aed581;
        font-size: 18px;
        width: 42px; cursor: pointer;
        display: flex; align-items: center; justify-content: center;
        transition: background 0.2s;
      }
      #micBtn.recording { background: #c62828; border-color: #e53935; color: white; animation: pulse 1s infinite; }
      #micBtn:hover:not(:disabled) { background: #263326; }
    </style>
  </head>
  <body>
    <header>
      <div class="dot" id="liveDot"></div>
      <h2>🖥️ Screen AI</h2>
      <span id="statusBadge">idle</span>
    </header>

    <!-- API Key -->
    <div id="apiRow">
      <input id="apiKeyInput" type="password" placeholder="Paste your Gemini API key here…" autocomplete="off" />
      <button id="saveKeyBtn">Save key</button>
    </div>

    <!-- Preview -->
    <div id="previewWrap">
      <canvas id="preview"></canvas>
      <div id="previewPlaceholder">Click <strong>Start capture</strong> to share your screen.<br/>Then ask anything about what's visible.</div>
      <div id="snapshotOverlay"></div>
    </div>

    <!-- Controls -->
    <div class="btn-row">
      <button class="ctrl primary" id="startBtn">▶ Start capture</button>
      <button class="ctrl snap"    id="snapBtn"  disabled>📸 Snapshot + Ask</button>
      <button class="ctrl danger"  id="stopBtn"  disabled>■ Stop</button>
    </div>

    <!-- Chat -->
    <div id="chat">
      <div class="msg sys">Start screen capture and ask anything about what you see.</div>
    </div>

    <!-- Input -->
    <div id="inputRow">
      <textarea id="userInput" rows="1" placeholder="Ask about your screen…"></textarea>
      <button id="micBtn" title="Voice input">🎤</button>
      <button id="sendBtn" disabled>➤</button>
    </div>

    <script src="screen.js"></script>
    <script>
      // Show any uncaught JS errors visibly in the chat
      window.addEventListener("error", (e) => {
        const chat = document.getElementById("chat");
        if (!chat) return;
        const div = document.createElement("div");
        div.className = "msg sys";
        div.style.color = "#ef5350";
        div.textContent = "JS Error: " + e.message + " (" + e.filename?.split("/").pop() + ":" + e.lineno + ")";
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
      });
    </script>
  </body>
</html>
